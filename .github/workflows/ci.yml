name: CI

on:
  push:
    branches: [main]
  pull_request:

# Só leitura do repositório: o pipeline não precisa escrever nada.
permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior, que já ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Checkstyle
        run: ./mvnw -B -ntp checkstyle:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testes ficam de fora até a fase 6: o contextLoads precisa de Postgres e Kafka.
      # O lint já roda no job acima, por isso o -Dcheckstyle.skip aqui.
      - name: Compilar e empacotar
        run: ./mvnw -B -ntp -DskipTests -Dcheckstyle.skip package
